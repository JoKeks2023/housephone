name: Bridge image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["bridge/**", "ha-addon/**", ".github/workflows/bridge-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jokeks2023/housephone-bridge
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Housephone Bridge
            org.opencontainers.image.description=FRITZ!Box ↔ iPhone/Apple Watch bridge (SIP, VoIP push, WebRTC)
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/jokeks2023/housephone-bridge
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Home Assistant add-on image (Dockerfile target "addon"). The Supervisor
  # pulls the tag named by `version` in ha-addon/housephone-bridge/config.yaml;
  # raise it there (and in CHANGELOG.md) to ship an update.
  publish-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(grep -E '^version:' ha-addon/housephone-bridge/config.yaml | tr -d '"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jokeks2023/housephone-bridge-addon
          tags: |
            type=edge,branch=master
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Housephone Bridge (Home Assistant add-on)
            org.opencontainers.image.description=FRITZ!Box ↔ iPhone/Apple Watch bridge as a Home Assistant add-on
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: bridge
          target: addon
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/jokeks2023/housephone-bridge-addon
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

