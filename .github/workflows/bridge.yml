name: Bridge

on:
  push:
    paths:
      - "bridge/**"
      - "ha-addon/**"
      - "docs/protocol/**"
      - ".github/workflows/bridge.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "ha-addon/**"
      - "docs/protocol/**"
      - ".github/workflows/bridge.yml"

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      # Excluded from -race because of an upstream data race in diago's
      # early-media handling (see internal/sipleg/earlymedia_test.go).
      - name: go test (early media, without -race)
        run: go test -count=1 -run EarlyMedia ./internal/sipleg/

      - name: go build
        run: go build -trimpath -o bin/housephone-bridge ./cmd/housephone-bridge

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build --build-arg VERSION=${{ github.sha }} -t housephone-bridge:ci bridge
      - name: smoke test image
        run: docker run --rm housephone-bridge:ci version
      - name: start hardened (read-only root, no capabilities, only /data writable)
        run: |
          cat > "$RUNNER_TEMP/config.yaml" <<'EOF'
          bridge:
            listen: "0.0.0.0:8080"
          sip:
            registrar: "192.168.178.1"
            username: "ci"
          media:
            detectPublicIp: false
            publicIpFromRouter: false
            stun: []
          EOF
          chmod 644 "$RUNNER_TEMP/config.yaml"
          docker run -d --name hardened \
            --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -p 127.0.0.1:18080:8080 \
            -v "$RUNNER_TEMP/config.yaml:/config/config.yaml:ro" \
            -v housephone-data:/data \
            -e HOUSEPHONE_SIP_PASSWORD=ci \
            housephone-bridge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/v1/health > health.json; then break; fi
            sleep 1
          done
          docker logs hardened
          test "$(cat health.json)" = '{"status":"ok"}'
          # identity.key was created in /data and is readable by the CLI.
          docker exec hardened housephone-bridge identity
          # The admin socket works in the distroless image (tui without a
          # terminal prints overview and self-test as text).
          docker exec hardened housephone-bridge tui | tee tui.txt
          grep -q "Selbsttest:" tui.txt
          grep -q "FRITZ!Box-Anmeldung" tui.txt
          docker exec hardened housephone-bridge devices list
          test "$(docker inspect -f '{{.State.Running}}' hardened)" = true
      - name: docker build (Home Assistant add-on)
        run: docker build --target addon --build-arg VERSION=${{ github.sha }} -t housephone-bridge-addon:ci bridge
      # Imitates the Supervisor: the hassio network (gateway 172.30.32.1),
      # a host-network add-on, /data/options.json, and the ingress proxy at
      # 172.30.32.2.
      - name: start add-on image like the Supervisor
        run: |
          docker network create --subnet 172.30.32.0/23 --gateway 172.30.32.1 hassio
          mkdir -p "$RUNNER_TEMP/addon-data"
          cat > "$RUNNER_TEMP/addon-data/options.json" <<'EOF'
          {"bridge_name": "CI", "public_url": "phone.example.com", "tunnel_port": 8080,
           "tailscale": false, "fritzbox_host": "192.168.178.1", "sip_username": "ci",
           "sip_password": "ci-secret-value", "push_relay": "off",
           "log_level": "info"}
          EOF
          # The Supervisor creates /data owned by root.
          sudo chown -R 0:0 "$RUNNER_TEMP/addon-data"
          docker run -d --name addon --network host --security-opt no-new-privileges:true --cap-drop ALL \
            -v "$RUNNER_TEMP/addon-data:/data" housephone-bridge-addon:ci
          for i in $(seq 1 30); do
            if curl -fsS http://172.30.32.1:8080/v1/health > addon-health.json; then break; fi
            sleep 1
          done
          docker logs addon 2>&1 | tee addon.log
          test "$(cat addon-health.json)" = '{"status":"ok"}'
          # The SIP password never reaches the log.
          ! grep -q "ci-secret-value" addon.log
          # Dashboard: the ingress proxy gets it, everyone else gets 403.
          docker run --rm --network hassio --ip 172.30.32.2 curlimages/curl:8.16.0 \
            -fsS -H "X-Ingress-Path: /api/hassio_ingress/ci" http://172.30.32.1:8099/ | tee dashboard.html
          grep -q 'base href="/api/hassio_ingress/ci/"' dashboard.html
          grep -q "Housephone Bridge" dashboard.html
          code=$(docker run --rm --network hassio --ip 172.30.32.9 curlimages/curl:8.16.0 -s -o /dev/null -w '%{http_code}' http://172.30.32.1:8099/)
          test "$code" = 403
          code=$(curl -s -o /dev/null -w '%{http_code}' http://172.30.32.1:8099/)
          test "$code" = 403
          # The home network listener refuses the add-on network.
          code=$(docker run --rm --network hassio --ip 172.30.32.9 curlimages/curl:8.16.0 -s -o /dev/null -w '%{http_code}' http://172.30.32.1:8081/v1/health)
          test "$code" = 403
          test "$(docker inspect -f '{{.State.Running}}' addon)" = true
