name: iOS

on:
  push:
    paths:
      - "Housephone einrichten.command"
      - "ios/**"
      - "docs/protocol/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Housephone einrichten.command"
      - "ios/**"
      - "docs/protocol/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: HousephoneKit tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(ls -1d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: ios/Packages/HousephoneKit
        run: swift test

  app:
    name: App build (unsigned, iOS device + embedded watch app)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(ls -1d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Housephone.xcodeproj/project.pbxproj') }}

      - name: Setup script (non-interactive, foreign team and prefix)
        run: |
          # Invalid input is rejected without writing anything.
          if ./"Housephone einrichten.command" --team bad --prefix org.example; then exit 1; fi
          if ./"Housephone einrichten.command" --team ABCDE12345 --prefix nodots; then exit 1; fi
          test ! -e ios/Config/Local.xcconfig
          # The build below uses these values, so the watch's companion ID
          # and every bundle ID must resolve from the prefix.
          ./"Housephone einrichten.command" --team ABCDE12345 --prefix org.example
          settings="$(xcodebuild -showBuildSettings -project ios/Housephone.xcodeproj -target Housephone)"
          grep -E ' DEVELOPMENT_TEAM = ABCDE12345$' <<<"$settings"
          grep -E ' PRODUCT_BUNDLE_IDENTIFIER = org.example.housephone$' <<<"$settings"
          # CarPlay (T-0017): off by default, --carplay switches the entitlements.
          grep -E ' CODE_SIGN_ENTITLEMENTS = Housephone/Housephone.entitlements$' <<<"$settings"
          ./"Housephone einrichten.command" --team ABCDE12345 --prefix org.example --carplay
          xcodebuild -showBuildSettings -project ios/Housephone.xcodeproj -target Housephone \
            | grep -E ' CODE_SIGN_ENTITLEMENTS = Housephone/Housephone-CarPlay.entitlements$'
          ./"Housephone einrichten.command" --team ABCDE12345 --prefix org.example --no-carplay
          ! grep -q HOUSEPHONE_CARPLAY_SUFFIX ios/Config/Local.xcconfig
          # Both entitlement files must differ only in the CarPlay key.
          python3 - <<'EOF'
          import plistlib
          base = plistlib.load(open("ios/Housephone/Housephone.entitlements", "rb"))
          carplay = plistlib.load(open("ios/Housephone/Housephone-CarPlay.entitlements", "rb"))
          assert carplay.pop("com.apple.developer.carplay-communication") is True
          assert base == carplay, "Housephone-CarPlay.entitlements is out of sync"
          EOF

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Housephone.xcodeproj \
            -scheme Housephone \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Build Local Push extension (mode without bridge, not embedded)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Housephone.xcodeproj \
            -scheme HousephoneLocalPush \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee extension.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" extension.log
          test -x DerivedData/Build/Products/Debug-iphoneos/HousephoneLocalPush.appex/HousephoneLocalPush
          # Not embedded until Apple grants the entitlement (ADR-0005).
          test ! -e DerivedData/Build/Products/Debug-iphoneos/Housephone.app/PlugIns/HousephoneLocalPush.appex

      - name: Check embedded watch app
        working-directory: ios
        run: |
          app="DerivedData/Build/Products/Debug-iphoneos/Housephone.app"
          # App Store Connect rejects a watch app outside Watch/ (ITMS-90680).
          watch="$app/Watch/HousephoneWatch.app"
          test -x "$watch/HousephoneWatch" || { echo "::error::Watch app is not embedded in Watch/"; ls -R "$app" | head -50; exit 1; }
          test ! -e "$app/PlugIns/HousephoneWatch.app" || { echo "::error::Watch app must not be in PlugIns/"; exit 1; }
          plutil -p "$watch/Info.plist" | grep -E '"(CFBundleIdentifier|WKApplication|WKCompanionAppBundleIdentifier|UIBackgroundModes)"' -A2
          # Built with the prefix from the setup script step.
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = org.example.housephone
          test "$(plutil -extract CFBundleIdentifier raw "$watch/Info.plist")" = org.example.housephone.watchkitapp
          test "$(plutil -extract WKCompanionAppBundleIdentifier raw "$watch/Info.plist")" = org.example.housephone
          lipo -info "$watch/HousephoneWatch"
          echo "Swift files compiled for watchOS: $(grep -c 'SwiftCompile.*HousephoneWatch' build.log || true)"

      - name: Check system integration (Siri, App Intents, widgets, complications, CarPlay)
        working-directory: ios
        run: |
          app="DerivedData/Build/Products/Debug-iphoneos/Housephone.app"
          plutil -extract INIntentsSupported json -o - "$app/Info.plist" | grep -q INStartCallIntent \
            || { echo "::error::INStartCallIntent missing from INIntentsSupported"; exit 1; }
          plutil -extract UIApplicationSceneManifest.UISceneConfigurations.CPTemplateApplicationSceneSessionRoleApplication json -o - "$app/Info.plist" | grep -q CarPlaySceneDelegate \
            || { echo "::error::CarPlay scene missing from Info.plist"; exit 1; }
          # App Shortcuts and intents are only found through this metadata.
          test -d "$app/Metadata.appintents" || { echo "::error::No App Intents metadata in the app"; exit 1; }
          ls "$app/Metadata.appintents"
          for entitlements in Housephone/Housephone.entitlements HousephoneWidgets/HousephoneWidgets.entitlements HousephoneWatch/HousephoneWatch.entitlements HousephoneWatchWidgets/HousephoneWatchWidgets.entitlements; do
            grep -q 'HOUSEPHONE_APP_GROUP' "$entitlements" \
              || { echo "::error::$entitlements must use HOUSEPHONE_APP_GROUP"; exit 1; }
          done
          # Widgets and controls (T-0017 phase 2).
          widgets="$app/PlugIns/HousephoneWidgets.appex"
          test -x "$widgets/HousephoneWidgets" || { echo "::error::Widget extension is not embedded in PlugIns/"; ls -R "$app/PlugIns" 2>/dev/null | head; exit 1; }
          test "$(plutil -extract CFBundleIdentifier raw "$widgets/Info.plist")" = org.example.housephone.widgets
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$widgets/Info.plist")" = com.apple.widgetkit-extension
          test -d "$widgets/Metadata.appintents" || { echo "::error::No App Intents metadata in the widget extension"; exit 1; }
          # Complications (T-0017 phase 3), inside the watch app.
          complications="$app/Watch/HousephoneWatch.app/PlugIns/HousephoneWatchWidgets.appex"
          test -x "$complications/HousephoneWatchWidgets" || { echo "::error::Complications are not embedded in the watch app"; ls -R "$app/Watch/HousephoneWatch.app/PlugIns" 2>/dev/null | head; exit 1; }
          test "$(plutil -extract CFBundleIdentifier raw "$complications/Info.plist")" = org.example.housephone.watchkitapp.widgets
          lipo -info "$complications/HousephoneWatchWidgets"
          # App Shortcuts on the watch ("Ruf <Favorit> mit Housephone an").
          test -d "$app/Watch/HousephoneWatch.app/Metadata.appintents" || { echo "::error::No App Intents metadata in the watch app"; exit 1; }

      - name: Check privacy manifests and licenses
        working-directory: ios
        run: |
          app="DerivedData/Build/Products/Debug-iphoneos/Housephone.app"
          watch="$app/Watch/HousephoneWatch.app"
          for bundle in "$app" "$watch" "$app/PlugIns/HousephoneWidgets.appex" "$watch/PlugIns/HousephoneWatchWidgets.appex"; do
            manifest="$bundle/PrivacyInfo.xcprivacy"
            test -f "$manifest" || { echo "::error::Missing $manifest"; exit 1; }
            plutil -lint "$manifest"
            plutil -p "$manifest" | grep -E 'NSPrivacyAccessedAPIType"|NSPrivacyTracking"'
          done
          test -f "$app/Frameworks/WebRTC.framework/PrivacyInfo.xcprivacy" && echo "WebRTC ships its own privacy manifest"
          count=$(ls "$app"/*.txt | wc -l | tr -d ' ')
          echo "Bundled license texts: $count"
          test "$count" -ge 11 || { echo "::error::Expected at least 11 license texts in the app bundle"; exit 1; }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ios/build.log
            ios/extension.log
