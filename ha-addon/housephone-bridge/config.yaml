name: Housephone Bridge
version: "0.4.0"
slug: housephone_bridge
description: Telefonieren über die FRITZ!Box mit iPhone und Apple Watch, auch unterwegs
url: https://github.com/JoKeks2023/housephone/tree/master/ha-addon/housephone-bridge
image: ghcr.io/jokeks2023/housephone-bridge-addon
arch:
  - aarch64
  - amd64
startup: services
# SIP and RTP to the FRITZ!Box, UDP 50000 for the media, the home network
# listener 8081 and the FRITZ!Box UPnP lookup need the host network.
host_network: true
ingress: true
# Only to read the add-on's own slug (GET /addons/self/info), so the
# dashboard can link to these options.
hassio_api: true
# Ingress on the default port 8099 (config.HAIngressPort in the bridge).
# panel_admin defaults to true: only Home Assistant admins see the panel.
panel_icon: mdi:phone
panel_title: Housephone
options:
  bridge_name: Zuhause
  public_url: ""
  tunnel_port: 8080
  tailscale: false
  bonjour: true
  fritzbox_host: 192.168.178.1
  sip_username: ""
  sip_password: ""
  lines: []
  log_level: info
schema:
  bridge_name: str
  # The tunnel hostname is enough; the bridge completes wss://…/v1/ws.
  public_url: match(^((wss?|https?)://)?[^\s/]+(/.*)?$)?
  lan_url: match(^ws://[^\s/]+(/.*)?$)?
  tunnel_port: port
  tailscale: bool
  bonjour: bool?
  fritzbox_host: str
  sip_username: str
  sip_password: password
  # Profiles (ADR-0008): the sip_* phone is the default profile, every
  # entry in lines is a further IP phone with its own number.
  profile_name: str?
  profile_numbers: str?
  lines:
    - id: "match(^[a-z0-9][a-z0-9-]{0,31}$)"
      name: str
      sip_username: str
      sip_password: password
      numbers: str?
  fritzbox_username: str?
  fritzbox_password: password?
  # Pushes go through the push relay of the app (ADR-0010); no APNs key in
  # Home Assistant. push_relay and apns_topic only for self-built apps.
  push_relay: match(^(off|https?://[^\s/]+(/.*)?)$)?
  apns_topic: str?
  log_level: list(debug|info|warn|error)
