name: Housephone Bridge
version: "0.1.0"
slug: housephone_bridge
description: Telefonieren über die FRITZ!Box mit iPhone und Apple Watch, auch unterwegs
url: https://github.com/JoKeks2023/housephone/tree/master/ha-addon/housephone-bridge
image: ghcr.io/jokeks2023/housephone-bridge-addon
arch:
  - aarch64
  - amd64
startup: services
# SIP and RTP to the FRITZ!Box, UDP 50000 for the media, the home network
# listener 8081 and the FRITZ!Box UPnP lookup need the host network.
host_network: true
ingress: true
# Ingress on the default port 8099 (config.HAIngressPort in the bridge).
# panel_admin defaults to true: only Home Assistant admins see the panel.
panel_icon: mdi:phone
panel_title: Housephone
# The APNs key (.p8) goes into the add-on's config folder
# (/addon_configs/<slug>/ on the host, /config in the container).
map:
  - type: addon_config
    read_only: true
options:
  bridge_name: Zuhause
  public_url: ""
  tunnel_port: 8080
  tailscale: false
  bonjour: true
  fritzbox_host: 192.168.178.1
  sip_username: ""
  sip_password: ""
  apns_team_id: T9CA6D7T8N
  apns_topic: com.jorisconrad.housephone.voip
  log_level: info
schema:
  bridge_name: str
  public_url: match(^wss?://[^\s/]+(/.*)?$)
  lan_url: match(^ws://[^\s/]+(/.*)?$)?
  tunnel_port: port
  tailscale: bool
  bonjour: bool?
  fritzbox_host: str
  sip_username: str
  sip_password: password
  fritzbox_username: str?
  fritzbox_password: password?
  apns_key_file: match(^/config/[^\s]+\.p8$)?
  apns_key_id: str?
  apns_team_id: str?
  apns_topic: str?
  log_level: list(debug|info|warn|error)
