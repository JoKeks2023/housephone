configuration:
  bridge_name:
    name: Bridge name
    description: The name the app shows, e.g. "Home".
  public_url:
    name: Public URL
    description: WebSocket URL through the Cloudflare Tunnel, e.g. wss://phone.example.com/v1/ws.
  lan_url:
    name: Home network URL (optional)
    description: Leave empty to derive it from the LAN IP. With Tailscale use the Tailscale IP, e.g. ws://100.101.102.103:8081/v1/ws.
  tunnel_port:
    name: Tunnel port
    description: Port for the Cloudflare Tunnel on 172.30.32.1. Point the Cloudflared add-on at http://172.30.32.1:8080.
  tailscale:
    name: Allow Tailscale
    description: Pairing and direct connections over Tailscale (100.64.0.0/10) too.
  bonjour:
    name: Announce in the home network (Bonjour)
    description: The app finds the bridge on the Wi-Fi without a QR code. You approve pairing in the dashboard when the code on the iPhone matches.
  fritzbox_host:
    name: FRITZ!Box address
    description: LAN IP of the FRITZ!Box, e.g. 192.168.178.1.
  sip_username:
    name: IP phone user name
    description: FRITZ!Box → Telephony → Telephony Devices → IP phone.
  sip_password:
    name: IP phone password
    description: Never logged.
  profile_name:
    name: Main profile name (optional)
    description: Only matters with several profiles, e.g. your first name. Empty means "Standard".
  profile_numbers:
    name: Main profile's own numbers (optional)
    description: Comma separated, e.g. 030 1234567. With several profiles a profile only sees the calls on its own numbers in the call list.
  lines:
    name: Further profiles
    description: Everyone with their own landline number gets their own IP phone in the FRITZ!Box and an entry here with id (a-z, 0-9, -), name, sip_username, sip_password and numbers (comma separated). Then pair devices into the right profile in the dashboard.
  fritzbox_username:
    name: FRITZ!Box user (optional)
    description: For the phonebook and call list. Needs only the right "Voice messages, fax messages, FRITZ!App Fon and call list".
  fritzbox_password:
    name: FRITZ!Box user password
    description: Only needed with a FRITZ!Box user.
  push_relay:
    name: Push relay (optional)
    description: Leave empty to send pushes end-to-end encrypted through the app's relay. Only enter your own relay URL for a self-built app; "off" disables pushes.
  apns_topic:
    name: APNs topic (optional)
    description: Leave empty. Only for self-built apps with their own relay, the bundle ID plus ".voip", i.e. <prefix>.housephone.voip.
  log_level:
    name: Log level
    description: Phone numbers are always masked in the log.
