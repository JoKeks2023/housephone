# Housephone Bridge + Cloudflare Tunnel
#
# 1. cp docker-compose.example.yml docker-compose.yml
#    cp config.example.yaml config.yaml   (anpassen)
# 2. mkdir -p data secrets
#    printf '%s' 'SIP-PASSWORT' > secrets/sip_password
#    (nur mit eigenem APNs-Key statt Push-Relay: cp ~/Downloads/AuthKey_XXXXXXXXXX.p8 secrets/apns_key.p8)
#    printf '%s' 'FRITZBOX-KENNWORT' > secrets/fritzbox_password   (optional, Telefonbuch/Anrufliste)
#    chmod 600 secrets/*
#    Dateien und data/ müssen dem Benutzer aus "user:" gehören (id -u / id -g).
# 3. CLOUDFLARE_TUNNEL_TOKEN=... docker compose up -d
# 4. docker compose exec housephone-bridge housephone-bridge pair -name "iPhone"
#    (zeigt QR-Code, Code und Bridge-Fingerabdruck und wartet auf das Gerät)
# 5. data/identity.key sichern: ohne diesen Schlüssel müssen alle Geräte neu
#    gekoppelt werden.

services:
  housephone-bridge:
    # Fertiges Image (amd64/arm64). Selbst bauen: Zeile auskommentieren und `build: .` aktivieren.
    image: ghcr.io/jokeks2023/housephone-bridge:edge
    # build: .
    container_name: housephone-bridge
    restart: unless-stopped
    # Host-Netzwerk: SIP/RTP zur FRITZ!Box und der WebRTC-Port 50000 ohne
    # zusätzliches Docker-NAT. Die Bridge erkennt so die richtige LAN-IP.
    network_mode: host
    user: "1000:1000"
    # Härtung: Dateisystem nur lesbar (beschreibbar ist allein /data mit
    # Geräten, Codes und dem Bridge-Schlüssel), keine Linux-Capabilities,
    # keine Rechteausweitung. Die Bridge braucht nur Ports über 1024.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOUSEPHONE_CONFIG: /config/config.yaml
      HOUSEPHONE_DATA_DIR: /data
      HOUSEPHONE_SIP_PASSWORD_FILE: /secrets/sip_password
      # Nur mit eigenem APNs-Key; sonst gehen Pushes über das Relay.
      # HOUSEPHONE_APNS_KEY_FILE: /secrets/apns_key.p8
      # HOUSEPHONE_APNS_KEY_ID: "XXXXXXXXXX"
      # Nur mit fritzbox.username in config.yaml (Telefonbuch/Anrufliste):
      HOUSEPHONE_FRITZBOX_PASSWORD_FILE: /secrets/fritzbox_password
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
      - ./secrets:/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    # Feste Version statt :latest: Updates bewusst einspielen
    # (https://github.com/cloudflare/cloudflared/releases).
    image: cloudflare/cloudflared:2026.9.3
    container_name: housephone-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
